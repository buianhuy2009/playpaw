<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PawPlay E2E Test Suite Runner</title>
  <style>
    :root {
      --bg: #0f111a;
      --card-bg: #1a1d2e;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --accent: #ffd166;
      --green: #2ea043;
      --red: #f85149;
      --blue: #58a6ff;
      --border: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand h1 {
      font-size: 1.8rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand p {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    button.btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    button.btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    button.btn-primary {
      background: #238636;
      border-color: #2ea043;
      color: #fff;
    }

    button.btn-primary:hover {
      background: #2ea043;
      border-color: #3fb950;
      color: #fff;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
    }

    .stat-card .label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
    }

    .stat-card .value {
      font-size: 2rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .stat-card.passed .value { color: var(--green); }
    .stat-card.failed .value { color: var(--red); }
    .stat-card.duration .value { color: var(--blue); }
    .stat-card.total .value { color: var(--accent); }

    /* Suite Section */
    .suite-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .suite-block {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .suite-header {
      background: rgba(255, 255, 255, 0.03);
      padding: 12px 16px;
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .suite-header .badge {
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    .badge-pass { background: rgba(46, 160, 67, 0.2); color: #3fb950; border: 1px solid #2ea043; }
    .badge-fail { background: rgba(248, 81, 73, 0.2); color: #f85149; border: 1px solid #da3633; }

    .test-list {
      list-style: none;
      padding: 8px 16px;
    }

    .test-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      font-size: 0.9rem;
    }

    .test-item:last-child {
      border-bottom: none;
    }

    .test-name {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-icon {
      font-weight: bold;
      font-size: 1rem;
    }

    .status-icon.passed { color: var(--green); }
    .status-icon.failed { color: var(--red); }

    .test-timing {
      color: var(--text-dim);
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
    }

    .error-box {
      margin: 8px 0 8px 24px;
      background: rgba(248, 81, 73, 0.1);
      border-left: 3px solid var(--red);
      padding: 8px 12px;
      color: #ff7b72;
      font-family: monospace;
      font-size: 0.82rem;
      white-space: pre-wrap;
    }

    /* Offscreen canvas used by tests */
    #testCanvasHolder {
      position: absolute;
      left: -9999px;
      top: -9999px;
      visibility: hidden;
    }
  </style>

  <!-- Load Harness and Polyfills -->
  <script src="harness/test_framework.js"></script>
  <script src="harness/virtual_clock.js"></script>
  <script src="harness/event_simulator.js"></script>
  <script src="harness/environment_mock.js"></script>
  <script src="harness/contract_adapter.js"></script>

  <!-- Load Test Suites -->
  <script src="suites/tier1_features.js"></script>
  <script src="suites/tier2_boundaries.js"></script>
  <script src="suites/tier3_pairwise.js"></script>
  <script src="suites/tier4_scenarios.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>🐾 PawPlay E2E Test Suite Runner</h1>
        <p>Biological-Calibrated Feline Engine Verification & Assurance</p>
      </div>
      <div class="controls">
        <button id="runBtn" class="btn btn-primary" onclick="runAllTests()">▶ Run All Tests</button>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card total">
        <div class="label">Total Tests</div>
        <div class="value" id="statTotal">--</div>
      </div>
      <div class="stat-card passed">
        <div class="label">Passed</div>
        <div class="value" id="statPassed">--</div>
      </div>
      <div class="stat-card failed">
        <div class="label">Failed</div>
        <div class="value" id="statFailed">--</div>
      </div>
      <div class="stat-card duration">
        <div class="label">Duration</div>
        <div class="value" id="statDuration">--</div>
      </div>
    </div>

    <div id="suitesContainer" class="suite-container">
      <div style="color: var(--text-dim); text-align: center; padding: 40px;">Initializing tests...</div>
    </div>
  </div>

  <div id="testCanvasHolder">
    <canvas id="gameCanvas" width="1024" height="768"></canvas>
  </div>

  <script>
    window.__PAWPLAY_TEST_RUNNER__ = PawPlayTestFramework.defaultRunner;

    async function runAllTests() {
      const runBtn = document.getElementById('runBtn');
      if (runBtn) runBtn.disabled = true;

      const container = document.getElementById('suitesContainer');
      container.innerHTML = '<div style="color: var(--text-dim); text-align: center; padding: 30px;">Running 4-tier test matrix...</div>';

      const results = await PawPlayTestFramework.defaultRunner.run();
      window.__PAWPLAY_TEST_RESULTS__ = results;

      // Update Stats
      document.getElementById('statTotal').innerText = results.total;
      document.getElementById('statPassed').innerText = results.passed;
      document.getElementById('statFailed').innerText = results.failed;
      document.getElementById('statDuration').innerText = results.durationMs + 'ms';

      // Render Suites
      container.innerHTML = '';
      results.suites.forEach(suite => {
        const suiteEl = document.createElement('div');
        suiteEl.className = 'suite-block';

        const isSuccess = suite.failed === 0;
        const badgeClass = isSuccess ? 'badge-pass' : 'badge-fail';
        const badgeText = `${suite.passed}/${suite.tests.length} PASS`;

        let testsHtml = '';
        suite.tests.forEach(test => {
          const pass = test.status === 'passed';
          const icon = pass ? '✓' : '✗';
          const iconClass = pass ? 'passed' : 'failed';
          const errorHtml = test.error ? `<div class="error-box">${escapeHtml(test.error.message)}</div>` : '';

          testsHtml += `
            <li class="test-item-wrapper">
              <div class="test-item">
                <span class="test-name">
                  <span class="status-icon ${iconClass}">${icon}</span>
                  ${escapeHtml(test.name)}
                </span>
                <span class="test-timing">${test.durationMs}ms</span>
              </div>
              ${errorHtml}
            </li>
          `;
        });

        suiteEl.innerHTML = `
          <div class="suite-header">
            <span>${escapeHtml(suite.name)}</span>
            <span class="badge ${badgeClass}">${badgeText}</span>
          </div>
          <ul class="test-list">
            ${testsHtml}
          </ul>
        `;

        container.appendChild(suiteEl);
      });

      if (runBtn) runBtn.disabled = false;

      // Dispatch event for automated listeners (DevTools MCP)
      window.dispatchEvent(new CustomEvent('pawplay-tests-complete', { detail: results }));
      return results;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Auto-run on load
    window.addEventListener('DOMContentLoaded', () => {
      runAllTests();
    });
  </script>
</body>
</html>
